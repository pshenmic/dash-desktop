appId: org.pshenmic.dashdesktop
productName: Dash Desktop
directories:
  buildResources: buildResources
afterPack: build/pruneForeignBinaries.cjs
buildDependenciesFromSource: true
# A platform-specific `files` list would be normalized into a second matcher
# that never receives electron-builder's own exclusions, so dist/ and .git/
# would be packaged. Everything platform-dependent lives in the afterPack hook.
files:
  # electron-vite emits out/; the sources it was built from and the tooling
  # around them are never loaded at runtime.
  - '!src{,/**/*}'
  - '!tests{,/**/*}'
  - '!review{,/**/*}'
  - '!build{,/**/*}'
  - '!{snap,flatpak}{,/**/*}'
  # Offline build inputs the Flatpak manifest unpacks into the source tree.
  - '!{flatpak-node,.electron-gyp}{,/**/*}'
  - '!.yarnrc'
  - '!{.claude,.idea,.obsidian}{,/**/*}'
  - '!{AGENTS.md,CLAUDE.md,README.md}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{electron.vite.config.ts,vitest.config.ts,eslint.config.mjs,postcss.config.js,tailwind.config.js}'
  - '!*.tsbuildinfo'
  # dash-core-sdk declares its build tools as runtime dependencies. Nothing in
  # its published sources imports either one.
  - '!node_modules/protoc{,/**/*}'
  - '!node_modules/typescript{,/**/*}'
  # Source-build machinery for sqlite3 and classic-level. npmRebuild produces
  # build/Release, which both bindings resolve before anything else — so the
  # Node-ABI prebuilds could not be loaded under Electron even if kept.
  - '!node_modules/{node-gyp,node-addon-api,prebuild-install,tar}{,/**/*}'
  - '!node_modules/sqlite3/deps{,/**/*}'
  - '!node_modules/classic-level/{deps,prebuilds}{,/**/*}'
  # React Native artifacts of the two N-API packages; under Electron the loader
  # resolves dist/binaries/native/<rust-triple> and falls back to the wasm.
  - '!node_modules/{pshenmic-dpp,crypto-toothpick}/dist/binaries/*.{android,apple}.node{,/**/*}'
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: ${name}-${version}-${os}-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlements: buildResources/entitlements.mac.plist
  entitlementsInherit: buildResources/entitlements.mac.plist
  # The prebuilt N-API binaries are one file per arch, identical in both halves
  # of a universal build; @electron/universal aborts on any such Mach-O that
  # this glob does not cover.
  x64ArchFiles: '**/dist/binaries/native/*-apple-darwin/*.node'
  target:
    - target: dmg
      arch:
        - universal
dmg:
  artifactName: ${name}-${version}-${os}-${arch}.${ext}
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  maintainer: pshenmic.dev
  category: Office;Finance;
  syncDesktopName: true
  # Matches the snap's launcher name; productName would also rename the macOS
  # app, the Windows installer and the deb's install folder.
  desktop:
    entry:
      Name: Dash Desktop Wallet
# The default toolset embeds a runtime that dlopens libfuse.so.2, which Ubuntu
# 24.04 no longer ships; 1.x embeds the static type2 runtime instead.
toolsets:
  appimage: 1.0.3
appImage:
  artifactName: ${name}-${version}-${os}-${arch}.${ext}
deb:
  artifactName: ${name}-${version}-${os}-${arch}.${ext}
  # Setting depends replaces electron-builder's default list, so that list is
  # repeated here. libasound2 is the addition: the Electron binary links
  # libasound.so.2 and will not start without it.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2
