name: Build

on:
  push:
    branches: [ "master", "develop", "feat/initial-setup" ]
  # Unfiltered: the default branch is not master/develop, and a branch filter
  # here matches the PR's base, so naming branches silently skips every PR.
  pull_request:
  workflow_dispatch:

# A new push supersedes the installers the previous run was producing.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide whether the others package.
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            script: build:linux
            artifacts: |
              dist/*.AppImage
              dist/*.deb
          - name: mac
            os: macos-latest
            script: build:mac
            artifacts: dist/*.dmg
          - name: windows
            os: windows-2022
            script: build:win
            artifacts: dist/*.exe
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24.x
        cache: yarn
    - name: Install dependencies
      run: yarn --frozen-lockfile
    - name: Build
      run: yarn ${{ matrix.script }}
    - name: Upload installers
      uses: actions/upload-artifact@v4
      with:
        name: dash-desktop-prebuild-${{ matrix.name }}
        path: ${{ matrix.artifacts }}
        if-no-files-found: error
        retention-days: 14

  build_flatpak_store:
    name: flatpak
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
    - uses: actions/checkout@v4
    - name: Lint manifest
      run: flatpak-builder-lint manifest flatpak/io.github.pshenmic.dash-desktop.yml
    - name: Build Flatpak
      uses: flathub-infra/flatpak-github-actions/flatpak-builder@933e9e8ca36e85046ebca8e211f0785c6becac40
      with:
        manifest-path: flatpak/io.github.pshenmic.dash-desktop.yml
        bundle: dash-desktop.flatpak
        upload-artifact: false
        cache: false
    - name: Upload installer
      uses: actions/upload-artifact@v4
      with:
        name: dash-desktop-prebuild-flatpak
        path: dash-desktop.flatpak
        if-no-files-found: error
        retention-days: 14
    - name: Lint build
      run: flatpak-builder-lint builddir flatpak_app
