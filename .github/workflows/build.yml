name: Build

on:
  push:
    branches: [ "master", "develop", "feat/initial-setup" ]
  # Unfiltered: the default branch is not master/develop, and a branch filter
  # here matches the PR's base, so naming branches silently skips every PR.
  pull_request:
  workflow_dispatch:

# A new push supersedes the installers the previous run was producing.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide whether the others package.
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            script: build:linux
            artifacts: |
              dist/*.AppImage
              dist/*.deb
          - name: mac
            os: macos-latest
            script: build:mac
            artifacts: dist/*.dmg
          - name: windows
            os: windows-2022
            script: build:win
            artifacts: dist/*.exe
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24.x
        cache: yarn
    - name: Install dependencies
      run: yarn --frozen-lockfile
    # A fork PR gets no secrets, and an empty CSC_LINK fails the build where an
    # unset one skips signing. Scoped to mac because electron-builder would also
    # sign the Windows installer with CSC_LINK. It refuses to sign any PR build
    # without CSC_FOR_PULL_REQUEST.
    - name: Load macOS signing credentials
      if: matrix.name == 'mac'
      env:
        CSC_LINK: ${{ secrets.CSC_LINK }}
        CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        [ -n "$CSC_LINK" ] || exit 0
        {
          echo "CSC_LINK=$CSC_LINK"
          echo "CSC_KEY_PASSWORD=$CSC_KEY_PASSWORD"
          echo "APPLE_ID=$APPLE_ID"
          echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD"
          echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
          echo "CSC_FOR_PULL_REQUEST=true"
        } >> "$GITHUB_ENV"
    - name: Build
      run: yarn ${{ matrix.script }}
    - name: Verify signature and notarization
      if: matrix.name == 'mac' && env.CSC_LINK != ''
      run: |
        for app in dist/mac*/*.app; do
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
        done
    - name: Upload installers
      uses: actions/upload-artifact@v4
      with:
        name: dash-desktop-prebuild-${{ matrix.name }}
        path: ${{ matrix.artifacts }}
        if-no-files-found: error
        retention-days: 14
