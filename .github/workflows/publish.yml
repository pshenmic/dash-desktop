name: Publish

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build_linux:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24.x
    - name: Install dependencies
      run: yarn --frozen-lockfile
    - name: Build Linux
      run: yarn build:linux
    - name: Upload Linux artifacts
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*.{AppImage,deb}

  # Rebuilt from scratch out of GitHub Releases, so the Pages site holds only
  # the last two stable debs and re-running this job repairs any bad state.
  publish_apt:
    needs: build_linux
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: apt-repo
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y apt-utils

      - id: pages
        uses: actions/configure-pages@v5

      - name: Import signing key
        env:
          APT_GPG_SECRET_KEY: ${{ secrets.APT_GPG_SECRET_KEY }}
        run: |
          test -n "$APT_GPG_SECRET_KEY" || { echo "::error::APT_GPG_SECRET_KEY is not set"; exit 1; }
          echo "$APT_GPG_SECRET_KEY" | gpg --batch --import
          echo "KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')" >> "$GITHUB_ENV"

      - name: Build repository
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_URL: ${{ steps.pages.outputs.base_url }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          mkdir -p site && cd site

          # Stable releases only, newest first; the previous one stays so a client
          # holding a pre-deploy index can still fetch it, and it can be pinned.
          tags=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq \
            '[.[] | select((.draft or .prerelease) | not) | select(any(.assets[]; .name | endswith(".deb")))][:2][].tag_name')
          echo "tags: ${tags:-<none>}"

          dir=dists/stable/main/binary-amd64
          mkdir -p "$dir" pool/main/d/dash-desktop
          for tag in $tags; do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.deb' \
              --dir "pool/main/d/dash-desktop/$tag"
          done
          apt-ftparchive packages pool > "$dir/Packages"
          gzip -9kf "$dir/Packages"

          # apt never downgrades, so a newest release that sorts below anything
          # already live would strand every machine that installed it.
          newest=$(head -n1 <<< "$tags")
          if [ -n "$newest" ]; then
            new=$(dpkg-deb -f pool/main/d/dash-desktop/"$newest"/*.deb Version)
            for old in $(curl -fsSL "$BASE_URL/$dir/Packages" 2>/dev/null | awk '/^Version:/ {print $2}' || true); do
              if dpkg --compare-versions "$new" lt "$old"; then
                echo "::error::$new ($newest) sorts below the published $old"
                exit 1
              fi
            done
          fi

          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=pshenmic \
            -o APT::FTPArchive::Release::Label="Dash Desktop" \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Architectures=amd64 \
            -o APT::FTPArchive::Release::Components=main \
            release dists/stable > Release.tmp
          mv Release.tmp dists/stable/Release

          gpg_sign() {
            gpg --batch --yes --pinentry-mode loopback --passphrase "${APT_GPG_PASSPHRASE:-}" \
              --default-key "$KEY_ID" "$@"
          }
          gpg_sign --clearsign -o dists/stable/InRelease dists/stable/Release
          gpg_sign --armor --detach-sign -o dists/stable/Release.gpg dists/stable/Release

          gpg --armor --export "$KEY_ID" > key.asc
          du -sh .

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

  publish_snap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build Snap
        id: build
        uses: snapcore/action-build@v1
      - name: Publish to Snap Store
        if: ${{ !github.event.release.prerelease }}
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: stable
      - name: Upload Snap artifact
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.snap }}

  build_mac:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24.x
    - name: Install dependencies
      run: yarn
    # electron-builder signs when CSC_LINK is set and notarizes when the APPLE_*
    # variables are; without forceCodeSigning a missing secret would skip both
    # and publish an unsigned dmg.
    - name: Build Mac
      run: yarn build:mac -c.forceCodeSigning=true
      env:
        CSC_LINK: ${{ secrets.CSC_LINK }}
        CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    - name: Verify signature and notarization
      run: |
        for app in dist/mac*/*.app; do
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
        done
    - name: Upload Mac artifacts
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*.dmg

  build_win:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24.x
    - name: Install dependencies
      run: yarn
    - name: Build Windows
      run: yarn build:win
    - name: Upload Windows artifacts
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*.exe
