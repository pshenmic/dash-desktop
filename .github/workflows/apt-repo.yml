name: APT repository

# Rebuilt from scratch out of GitHub Releases on every run, so the Pages site
# holds only the last two stable debs and a re-run repairs any bad state.
on:
  workflow_run:
    workflows: [Publish]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: apt-repo
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y apt-utils

      - id: pages
        uses: actions/configure-pages@v5

      - name: Import signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          test -n "$APT_GPG_PRIVATE_KEY" || { echo "::error::APT_GPG_PRIVATE_KEY is not set"; exit 1; }
          echo "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          echo "KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')" >> "$GITHUB_ENV"

      - name: Build repository
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_URL: ${{ steps.pages.outputs.base_url }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          mkdir -p site && cd site

          # Stable releases only, newest first; the previous one stays so a client
          # holding a pre-deploy index can still fetch it, and it can be pinned.
          tags=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq \
            '[.[] | select((.draft or .prerelease) | not) | select(any(.assets[]; .name | endswith(".deb")))][:2][].tag_name')
          echo "tags: ${tags:-<none>}"

          dir=dists/stable/main/binary-amd64
          mkdir -p "$dir" pool/main/d/dash-desktop
          for tag in $tags; do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.deb' \
              --dir "pool/main/d/dash-desktop/$tag"
          done
          apt-ftparchive packages pool > "$dir/Packages"
          gzip -9kf "$dir/Packages"

          # apt never downgrades, so a newest release that sorts below anything
          # already live would strand every machine that installed it.
          newest=$(head -n1 <<< "$tags")
          if [ -n "$newest" ]; then
            new=$(dpkg-deb -f pool/main/d/dash-desktop/"$newest"/*.deb Version)
            for old in $(curl -fsSL "$BASE_URL/$dir/Packages" 2>/dev/null | awk '/^Version:/ {print $2}' || true); do
              if dpkg --compare-versions "$new" lt "$old"; then
                echo "::error::$new ($newest) sorts below the published $old"
                exit 1
              fi
            done
          fi

          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=pshenmic \
            -o APT::FTPArchive::Release::Label="Dash Desktop" \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Architectures=amd64 \
            -o APT::FTPArchive::Release::Components=main \
            release dists/stable > Release.tmp
          mv Release.tmp dists/stable/Release

          gpg_sign() {
            gpg --batch --yes --pinentry-mode loopback --passphrase "${APT_GPG_PASSPHRASE:-}" \
              --default-key "$KEY_ID" "$@"
          }
          gpg_sign --clearsign -o dists/stable/InRelease dists/stable/Release
          gpg_sign --armor --detach-sign -o dists/stable/Release.gpg dists/stable/Release

          gpg --armor --export "$KEY_ID" > key.asc
          du -sh .

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
