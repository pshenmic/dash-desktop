id: io.github.pshenmic.dash-desktop
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: dash-desktop-wallet
separate-locales: false
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # The wallet database, logs and chain storage live in ~/.dash-desktop.
  - --persist=.dash-desktop

modules:
  - name: dash-desktop
    buildsystem: simple
    build-commands:
      - bsdtar -Oxf dash-desktop.deb data.tar.xz | bsdtar -xf -
      # zypak provides the Chromium sandbox inside Flatpak; the SUID helper cannot run.
      - rm "opt/Dash Desktop/chrome-sandbox"
      - cp -a "opt/Dash Desktop" "${FLATPAK_DEST}/dash-desktop"
      - install -Dm755 dash-desktop-wallet.sh "${FLATPAK_DEST}/bin/dash-desktop-wallet"
      - install -Dm644 usr/share/icons/hicolor/512x512/apps/dash-desktop.png "${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/${FLATPAK_ID}.png"
      - install -Dm644 "${FLATPAK_ID}.desktop" -t "${FLATPAK_DEST}/share/applications"
      - install -Dm644 "${FLATPAK_ID}.metainfo.xml" -t "${FLATPAK_DEST}/share/metainfo"
    sources:
      - type: file
        dest-filename: dash-desktop.deb
        url: https://github.com/pshenmic/dash-desktop/releases/download/1.0.0-beta.4/dash-desktop-1.0.0-beta.4-linux-amd64.deb
        sha256: a389593121a00d6e66b872b6a94588650dfbcfd79e5f815ea44bf51e355b82df
        only-arches:
          - x86_64
        x-checker-data:
          type: json
          url: https://api.github.com/repos/pshenmic/dash-desktop/releases
          version-query: map(select(.draft | not)) | first | .tag_name
          url-query: map(select(.draft | not)) | first | .assets[] | select(.name == "dash-desktop-" + $version + "-linux-amd64.deb") | .browser_download_url
          timestamp-query: map(select(.draft | not)) | first | .published_at
          is-main-source: true
      - type: script
        dest-filename: dash-desktop-wallet.sh
        commands:
          - exec zypak-wrapper /app/dash-desktop/dash-desktop "$@"
      - type: file
        path: io.github.pshenmic.dash-desktop.desktop
      - type: file
        path: io.github.pshenmic.dash-desktop.metainfo.xml
