id: io.github.pshenmic.dash-desktop
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
command: dash-desktop-wallet
separate-locales: false
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # The wallet database, logs and chain storage live in ~/.dash-desktop.
  - --persist=.dash-desktop

modules:
  - name: dash-desktop
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node24/bin
      env:
        HOME: /run/build/dash-desktop
        # Where generated-sources.json places the Electron zip and node-gyp headers.
        XDG_CACHE_HOME: /run/build/dash-desktop/flatpak-node/cache
    build-commands:
      - yarn config --offline set yarn-offline-mirror "$FLATPAK_BUILDER_BUILDDIR/flatpak-node/yarn-mirror"
      - yarn install --offline --frozen-lockfile
      - yarn build
      # @electron/rebuild reads Electron headers from ~/.electron-gyp, not the node-gyp cache.
      - v=$(node -p "require('electron/package.json').version") && mkdir -p .electron-gyp && ln -sfn "$XDG_CACHE_HOME/node-gyp/$v" ".electron-gyp/$v"
      - . flatpak-node/electron-builder-arch-args.sh && node_modules/.bin/electron-builder --linux dir $ELECTRON_BUILDER_ARCH_ARGS --publish never
      # zypak provides the Chromium sandbox inside Flatpak; the SUID helper cannot run.
      - rm dist/linux*-unpacked/chrome-sandbox
      - cp -a dist/linux*-unpacked "${FLATPAK_DEST}/dash-desktop"
      - install -Dm755 dash-desktop-wallet.sh "${FLATPAK_DEST}/bin/dash-desktop-wallet"
      - install -Dm644 buildResources/icon.png "${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/${FLATPAK_ID}.png"
      - install -Dm644 "flatpak/${FLATPAK_ID}.desktop" -t "${FLATPAK_DEST}/share/applications"
      - install -Dm644 "flatpak/${FLATPAK_ID}.metainfo.xml" -t "${FLATPAK_DEST}/share/metainfo"
    sources:
      - type: dir
        path: ..
        skip:
          - .flatpak-builder
          - .git
          - flatpak_app
          - repo
          - node_modules
          - out
          - dist
      - generated-sources.json
      - type: script
        dest-filename: dash-desktop-wallet.sh
        commands:
          - exec zypak-wrapper /app/dash-desktop/dash-desktop "$@"
